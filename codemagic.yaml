workflows:
  android-apk:
    name: Build PDF Arabic Translator APK
    max_build_duration: 60

    environment:
      flutter: 3.47.5

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Create Android project
        script: |
          flutter create --platforms=android --org com.sumer --project-name pdf_arabic_translator buildapp

      - name: Copy app source and patch Android
        script: |
          cp pubspec.yaml buildapp/pubspec.yaml
          rm -rf buildapp/lib buildapp/test
          cp -r lib buildapp/lib
          python3 tool/patch_android.py buildapp/android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        script: |
          cd buildapp
          flutter pub get

      - name: Generate custom launcher icon
        script: |
          set -e
          ICON="$CM_BUILD_DIR/assets/app_icon.png"
          RES="$CM_BUILD_DIR/buildapp/android/app/src/main/res"

          if [ ! -f "$ICON" ]; then
            echo "Missing launcher icon: $ICON"
            exit 1
          fi

          make_icon() {
            DIR="$1"
            SIZE="$2"
            mkdir -p "$RES/$DIR"
            sips -s format png -z "$SIZE" "$SIZE" "$ICON" --out "$RES/$DIR/ic_launcher.png" >/dev/null
            cp "$RES/$DIR/ic_launcher.png" "$RES/$DIR/ic_launcher_round.png"
          }

          make_icon mipmap-mdpi 48
          make_icon mipmap-hdpi 72
          make_icon mipmap-xhdpi 96
          make_icon mipmap-xxhdpi 144
          make_icon mipmap-xxxhdpi 192

          # Force Android to use our raster icon instead of Flutter's default
          # adaptive launcher resources.
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          echo "Custom Book Translator launcher icon generated."

      - name: Analyze source
        script: |
          cd buildapp
          flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Verify Android release config
        script: |
          grep -R "BOOK_TRANSLATOR_DISABLE_R8" buildapp/android/app/build.gradle* || true

      - name: Build APK
        script: |
          cd buildapp
          flutter build apk --release

    artifacts:
      - buildapp/build/app/outputs/flutter-apk/*.apk
