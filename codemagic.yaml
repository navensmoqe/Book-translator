workflows:
  android-apk:
    name: Build PDF Arabic Translator APK
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Create Android project
        script: |
          flutter create --platforms=android --org com.sumer --project-name pdf_arabic_translator buildapp

      - name: Copy app source
        script: |
          cp pubspec.yaml buildapp/pubspec.yaml
          rm -rf buildapp/lib
          cp -r lib buildapp/lib
          python3 tool/patch_android.py buildapp/android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        script: |
          cd buildapp
          flutter pub get

      - name: Build APK
        script: |
          cd buildapp
          flutter build apk --release

    artifacts:
      - buildapp/build/app/outputs/flutter-apk/app-release.apk
