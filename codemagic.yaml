workflows:
  android-apk:
    name: Build PDF Arabic Translator APK
    max_build_duration: 60

    environment:
      flutter: 3.47.5

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Create Android project
        script: |
          flutter create --platforms=android --org com.sumer --project-name pdf_arabic_translator buildapp

      - name: Copy app source and patch Android
        script: |
          cp pubspec.yaml buildapp/pubspec.yaml
          rm -rf buildapp/lib buildapp/test
          cp -r lib buildapp/lib
          python3 tool/patch_android.py buildapp/android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        script: |
          cd buildapp
          flutter pub get

      - name: Install custom launcher icon
        script: |
          set -e
          ICON="$CM_BUILD_DIR/assets/app_icon.png"
          RES="$CM_BUILD_DIR/buildapp/android/app/src/main/res"

          if [ ! -f "$ICON" ]; then
            echo "Missing launcher icon: $ICON"
            exit 1
          fi

          python3 -m pip install --quiet Pillow

          ICON="$ICON" RES="$RES" python3 - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image

          icon = Path(os.environ["ICON"])
          res = Path(os.environ["RES"])

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          with Image.open(icon) as src:
              src = src.convert("RGBA")
              for folder, size in sizes.items():
                  target_dir = res / folder
                  target_dir.mkdir(parents=True, exist_ok=True)

                  resized = src.resize((size, size), Image.Resampling.LANCZOS)
                  for name in ("ic_launcher.png", "ic_launcher_round.png"):
                      target = target_dir / name
                      resized.save(
                          target,
                          format="PNG",
                          optimize=False,
                          compress_level=6,
                      )
                      # Verify Pillow can reopen the exact file written.
                      with Image.open(target) as check:
                          check.verify()
                      print(f"Wrote {target} ({size}x{size})")

          anydpi = res / "mipmap-anydpi-v26"
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              path = anydpi / name
              if path.exists():
                  path.unlink()

          print("Custom Book Translator launcher icons normalized successfully.")
          PY

      - name: Analyze source
        script: |
          cd buildapp
          flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Verify Android release config
        script: |
          grep -R "BOOK_TRANSLATOR_DISABLE_R8" buildapp/android/app/build.gradle* || true

      - name: Build APK
        script: |
          cd buildapp
          flutter build apk --release

    artifacts:
      - buildapp/build/app/outputs/flutter-apk/*.apk
