name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold
        run: flutter create --platforms=android --org com.sumer --project-name pdf_arabic_translator buildapp

      - name: Copy project sources
        run: |
          cp pubspec.yaml buildapp/pubspec.yaml
          rm -rf buildapp/lib
          cp -r lib buildapp/lib
          python3 tool/patch_android.py buildapp/android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: buildapp
        run: flutter pub get

      - name: Build release APK
        working-directory: buildapp
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Arabic-Translator-APK
          path: buildapp/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
